<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance IV CSE AIML C</title>

<style>
body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:#f0f2f5;
    margin:0;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

h2{
    margin-bottom:20px;
}

.grid-container{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    width:100%;
    max-width:400px;
}

.roll-btn{
    background:#e0e0e0;
    border:1px solid #ccc;
    border-radius:8px;
    padding:15px 0;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
    user-select:none;
}

.roll-btn.absent{
    background:#ff4d4d;
    color:white;
    border-color:#ff0000;
}

.section-header{
    grid-column:span 4;
    text-align:center;
    font-weight:bold;
    margin-top:10px;
}

.action-area{
    width:100%;
    max-width:400px;
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.btn-main{
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
    font-weight:bold;
}

#generateBtn{
    background:#1976D2;
}

#copyBtn{
    background:#4CAF50;
    display:none;
}

textarea{
    width:100%;
    height:170px;
    display:none;
    resize:none;
    padding:10px;
    box-sizing:border-box;
    border-radius:8px;
    font-family:monospace;
}
</style>

</head>

<body>

<h2>IV CSE AIML C</h2>

<div class="grid-container" id="rollGrid"></div>

<div class="action-area">
    <button id="generateBtn" class="btn-main" onclick="generateMessage()">Generate Message</button>

    <textarea id="outputBox" readonly></textarea>

    <button id="copyBtn" class="btn-main" onclick="copyText()">Copy Message</button>
</div>

<script>

const regularRolls=[
"D3","D4","D5","D6","D7","D8","D9",
"E0","E1","E2","E3","E4","E5","E6","E7","E8","E9",
"F0","F1","F2","F3","F4","F5","F6","F7","F8","F9",
"G0","G1","G2","G3","G4","G5","G6","G7","G8","G9",
"H0","H1","H2","H3","H4","H5","H6","H7","H8","H9",
"J0","J1","J3","J4","J5","J6","J7","J8","J9",
"K0","K1","K2","K3","K4","K5","K6","K7","K8"
];

const lateralRolls=[
"15","16","17","18","19"
];

const grid=document.getElementById("rollGrid");

const totalCount=regularRolls.length+lateralRolls.length;

function createButtons(){

    regularRolls.forEach(roll=>{
        const btn=document.createElement("button");
        btn.className="roll-btn";
        btn.innerText=roll;
        btn.onclick=()=>toggleAbsent(btn);
        grid.appendChild(btn);
    });

    const header=document.createElement("div");
    header.className="section-header";
    header.innerText="--- Lateral Entries ---";
    grid.appendChild(header);

    lateralRolls.forEach(roll=>{
        const btn=document.createElement("button");
        btn.className="roll-btn";
        btn.innerText=roll;
        btn.onclick=()=>toggleAbsent(btn);
        grid.appendChild(btn);
    });
}

function toggleAbsent(btn){
    btn.classList.toggle("absent");
}

function generateMessage(){

    const absentButtons=document.querySelectorAll(".roll-btn.absent");

    const absenteesList=Array.from(absentButtons).map(btn=>btn.innerText);

    const absentCount=absenteesList.length;
    const presentCount=totalCount-absentCount;

    const today=new Date();

    const dateStr=
    String(today.getDate()).padStart(2,"0")+"/"+
    String(today.getMonth()+1).padStart(2,"0")+"/"+
    today.getFullYear();

    // Automatically shows FN before 12 PM, otherwise AN
    const session=today.getHours()<12?"FN":"AN";

    let message=`IV CSE AIML C
${dateStr} ${session} Absentees :

`;

    if(absenteesList.length>0){
        message+=absenteesList.join(", ");
    }else{
        message+="None";
    }

    message+=`

Absent - ${absentCount}
Present - ${presentCount}
Total - ${totalCount}`;

    const output=document.getElementById("outputBox");

    output.style.display="block";
    output.value=message;

    document.getElementById("copyBtn").style.display="block";

    window.scrollTo(0,document.body.scrollHeight);
}

function copyText(){

    const output=document.getElementById("outputBox");

    navigator.clipboard.writeText(output.value);

    alert("Attendance copied successfully.");
}

createButtons();

</script>

</body>
</html>
